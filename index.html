<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stammbaum</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.2rem; color: #2c3e50; }
        .tree { display: flex; flex-direction: column; gap: 40px; align-items: center; margin-top: 20px; }
        .generation { display: flex; justify-content: center; gap: 20px; width: 100%; position: relative; }
        
        /* Linien-Logik über CSS-Pseudoelemente */
        .generation::after {
            content: ""; position: absolute; bottom: -20px; left: 25%; right: 25%; height: 2px; background: #bdc3c7; z-index: 1;
        }
        .generation:last-child::after { display: none; }

        .node {
            width: 90px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center; padding: 10px 5px; min-height: 90px; border-top: 4px solid #bdc3c7;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2;
        }
        .node.male { border-top-color: #3498db; }
        .node.female { border-top-color: #e74c3c; }
        
        .avatar { font-size: 1.2rem; margin-bottom: 4px; }
        .name { font-weight: bold; font-size: 0.75rem; }
        .date { font-size: 0.65rem; color: #7f8c8d; margin-top: 2px; }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum</h1>

    <div class="tree">
        <!-- Großeltern-Ebene -->
        <div class="generation">
            <div class="node male"><div class="avatar">👤</div><div class="name">Uropa P.</div><div class="date">1910</div></div>
            <div class="node female"><div class="avatar">👩</div><div class="name">Uroma P.</div><div class="date">1915</div></div>
            <div class="node male"><div class="avatar">👤</div><div class="name">Uropa L.</div><div class="date">1920</div></div>
            <div class="node female"><div class="avatar">👩</div><div class="name">Raisa G.</div><div class="date">1941</div></div>
        </div>

        <!-- Eltern-Ebene -->
        <div class="generation">
            <div class="node male"><div class="avatar">👤</div><div class="name">Vladimir L.</div><div class="date">1959</div></div>
            <div class="node female"><div class="avatar">👩</div><div class="name">Swetlana P.</div><div class="date">1961</div></div>
        </div>

        <!-- Du-Ebene -->
        <div class="generation">
            <div class="node male"><div class="avatar">👤</div><div class="name">Alexander P.</div><div class="date">1982</div></div>
        </div>
    </div>

</body>
</html>

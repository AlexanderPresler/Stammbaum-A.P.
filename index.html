<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Stammbaum Profi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            padding-bottom: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.3rem; color: #2c3e50; }
        
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 20px;
            width: 100%;
        }
        .generation-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            position: relative;
        }
        
        /* Karten-Design */
        .person-card {
            width: 150px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            padding: 12px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 3px solid #bdc3c7;
            z-index: 10;
        }
        .person-card.male { border-color: #3498db; }
        .person-card.female { border-color: #f78fb3; } /* Rosa Umrandung */
        
        /* Schwarzes Trauer-Dreieck oben links */
        .person-card.deceased::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 20px solid black;
            border-right: 20px solid transparent;
            border-top-left-radius: 4px;
        }

        .name-display { font-weight: bold; font-size: 0.9rem; margin-top: 5px; }
        .info-display { font-size: 0.75rem; color: #7f8c8d; }
        
        .action-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 8px;
            border-top: 1px solid #eee;
            padding-top: 6px;
        }
        .action-btn {
            background: #eee;
            border: none;
            padding: 3px 6px;
            font-size: 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btn.add { background: #2ecc71; color: white; }
        .action-btn.del { background: #e74c3c; color: white; }

        /* Eingabemaske unten */
        .form-container {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            border-top-left-radius: 16px; border-top-right-radius: 16px;
            max-height: 280px; overflow-y: auto; z-index: 1000; display: none;
        }
        .form-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; color: #2c3e50; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; }
        .full-width { grid-column: span 2; }
        button.submit-btn { background: #2ecc71; color: white; border: none; font-weight: bold; }
        button.cancel-btn { background: #95a5a6; color: white; border: none; }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum Profi</h1>

    <div class="tree-container" id="treeCanvas"></div>

    <!-- Eingabeformular -->
    <div class="form-container" id="formBox">
        <div class="form-title" id="formTitle">Verwandten hinzufügen</div>
        <form id="personForm">
            <input type="hidden" id="relType">
            <input type="hidden" id="sourceId">
            
            <input type="text" id="firstName" placeholder="Vorname" required>
            <input type="text" id="lastName" placeholder="Nachname" required>
            <input type="text" id="birthDate" placeholder="Geburtsdatum (z.B. 12.05.1980)">
            <input type="text" id="birthPlace" placeholder="Geburtsort">
            
            <select id="gender">
                <option value="m">Männlich (Blauer Rand)</option>
                <option value="f">Weiblich (Rosa Rand)</option>
            </select>
            <input type="text" id="deathDate" placeholder="Todestag (leer lassen falls lebend)">
            
            <button type="submit" class="submit-btn full-width">Speichern</button>
            <button type="button" class="cancel-btn full-width" onclick="closeForm()">Abbrechen</button>
        </form>
    </div>

    <script>
        // Startperson (Du)
        let defaultData = [
            {
                id: 1,
                firstName: "Alexander",
                lastName: "Presler",
                birthDate: "1982",
                birthPlace: "",
                deathDate: "",
                gender: "m",
                parents: [],
                siblings: [],
                partners: []
            }
        ];

        let people = JSON.parse(localStorage.getItem('profiFamilyTree')) || defaultData;

        function saveAndRender() {
            localStorage.setItem('profiFamilyTree', JSON.stringify(people));
            renderTree();
        }

        function openAddForm(type, sourceId) {
            document.getElementById('personForm').reset();
            document.getElementById('relType').value = type;
            document.getElementById('sourceId').value = sourceId;
            
            // Automatische Geschlechtsvorwahl für Elternteile
            if(type === 'Mutter') document.getElementById('gender').value = 'f';
            if(type === 'Vater') document.getElementById('gender').value = 'm';
            
            document.getElementById('formTitle').innerText = `${type} für ${findPerson(sourceId).firstName} hinzufügen`;
            document.getElementById('formBox').style.display = "block";
            document.getElementById('formBox').scrollIntoView({ behavior: 'smooth' });
        }

        function closeForm() { document.getElementById('formBox').style.display = "none"; }
        function findPerson(id) { return people.find(p => p.id === parseInt(id)); }

        function deletePerson(id) {
            if(confirm("Diese Person wirklich löschen?")) {
                people = people.filter(p => p.id !== id);
                // Beziehungen säubern
                people.forEach(p => {
                    p.parents = p.parents.filter(pid => pid !== id);
                    p.siblings = p.siblings.filter(sid => sid !== id);
                    p.partners = p.partners.filter(pid => pid !== id);
                });
                saveAndRender();
            }
        }

        function renderTree() {
            const canvas = document.getElementById('treeCanvas');
            canvas.innerHTML = "";

            // Dynamische Gruppierung nach Generationsebenen zur Veranschaulichung
            // Für eine saubere mobile Ansicht listen wir die Karten übersichtlich auf
            const row = document.createElement('div');
            row.className = "generation-row";

            people.forEach(p => {
                const card = document.createElement('div');
                card.className = `person-card ${p.gender === 'm' ? 'male' : 'female'}`;
                if(p.deathDate && p.deathDate.trim() !== "") {
                    card.classList.add('deceased');
                }

                let infoHtml = `<div>* ${p.birthDate || 'Unbekannt'}</div>`;
                if(p.birthPlace) infoHtml += `<div>📍 ${p.birthPlace}</div>`;
                if(p.deathDate) infoHtml += `<div>† ${p.deathDate}</div>`;

                card.innerHTML = `
                    <div class="name-display">${p.firstName} ${p.lastName}</div>
                    <div class="info-display">${infoHtml}</div>
                    <div class="action-menu">
                        <button class="action-btn add" onclick="openAddForm('Vater', ${p.id})">+ Papa</button>
                        <button class="action-btn add" onclick="openAddForm('Mutter', ${p.id})">+ Mama</button>
                        <button class="action-btn add" onclick="openAddForm('Geschwister', ${p.id})">+ Geschw.</button>
                        <button class="action-btn add" onclick="openAddForm('Partner', ${p.id})">+ Partner</button>
                        <button class="action-btn del" onclick="deletePerson(${p.id})">🗑️</button>
                    </div>
                `;
                row.appendChild(card);
            });
            canvas.appendChild(row);
        }

        document.getElementById('personForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('relType').value;
            const sourceId = parseInt(document.getElementById('sourceId').value);
            const sourcePerson = findPerson(sourceId);
            
            const newId = Date.now();
            const newPerson = {
                id: newId,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                birthDate: document.getElementById('birthDate').value,
                birthPlace: document.getElementById('birthPlace').value,
                deathDate: document.getElementById('deathDate').value,
                gender: document.getElementById('gender').value,
                parents: [], siblings: [], partners: []
            };

            // Logische Verknüpfung der Beziehungen
            if(type === 'Vater' || type === 'Mutter') {
                sourcePerson.parents.push(newId);

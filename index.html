<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Familienstammbaum</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            color: #333;
            padding-bottom: 280px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* Mehr Platz für Linien */
            margin-top: 30px;
            position: relative;
        }
        .generation-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }
        .generation {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
        /* Verbindungslinie zwischen Paaren in einer Generation */
        .generation::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: #bdc3c7;
            z-index: 1;
            display: none; /* Wird per JS aktiviert, wenn > 1 Person */
        }
        .generation.has-multiple::after {
            display: block;
        }
        .person-card {
            background: white;
            border-left: 5px solid #3498db;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-width: 140px;
            text-align: center;
            position: relative;
            cursor: pointer;
        }
        .person-card.female {
            border-left-color: #e74c3c;
        }
        .name {
            font-weight: bold;
            font-size: 1rem;
            padding-right: 15px;
        }
        .dates {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px;
        }
        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #95a5a6;
            margin-bottom: 8px;
            text-align: center;
        }
        /* Formular am unteren Rand */
        .form-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 1000;
        }
        .form-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input[type="text"] {
            grid-column: span 2;
        }
        button.submit-btn {
            grid-column: span 2;
            background-color: #2ecc71;
            color: white;
            border: none;
            font-weight: bold;
        }
        button.cancel-btn {
            grid-column: span 2;
            background-color: #95a5a6;
            color: white;
            border: none;
            display: none;
        }
        .empty-message {
            color: #95a5a6;
            font-style: italic;
            font-size: 0.9rem;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum</h1>

    <div class="tree-container" id="tree">
        <!-- Großeltern -->
        <div class="generation-wrapper">
            <div class="label">Großeltern</div>
            <div class="generation" id="gen-grandparents"></div>
        </div>

        <!-- Eltern -->
        <div class="generation-wrapper">
            <div class="label">Eltern</div>
            <div class="generation" id="gen-parents"></div>
        </div>

        <!-- Kinder -->
        <div class="generation-wrapper">
            <div class="label">Kinder / Ich</div>
            <div class="generation" id="gen-children"></div>
        </div>
    </div>

    <!-- Eingabe-Formular -->
    <div class="form-container">
        <div class="form-title" id="formTitle">➕ Neue Person hinzufügen</div>
        <form id="personForm">
            <input type="hidden" id="editIndex" value="-1">
            <input type="text" id="name" placeholder="Name" required>
            <input type="number" id="birth" placeholder="Geburtsjahr">
            <input type="number" id="death" placeholder="Todesjahr (falls tot)">
            <select id="gnd">
                <option value="m">Männlich (Blau)</option>
                <option value="f">Weiblich (Rot)</option>
            </select>
            <select id="gen">
                <option value="grandparents">Großeltern</option>
                <option value="parents">Eltern</option>
                <option value="children">Kinder / Ich</option>
            </select>
            <button type="submit" class="submit-btn" id="submitBtn">Hinzufügen</button>
            <button type="button" class="cancel-btn" id="cancelBtn" onclick="resetForm()">Abbrechen</button>
        </form>
    </div>

    <script>
        // Einmaliges Aufräumen: Wenn noch "Opa Müller" im Speicher ist, löschen wir ihn
        let savedTree = localStorage.getItem('myFamilyTree');
        if (savedTree && savedTree.includes("Opa Müller")) {
            localStorage.removeItem('myFamilyTree');
        }

        // Stammbaum startet jetzt komplett leer []
        let familyData = JSON.parse(localStorage.getItem('myFamilyTree')) || [];

        function renderTree() {
            const gens = ['grandparents', 'parents', 'children'];
            
            gens.forEach(gen => {
                const container = document.getElementById(`gen-${gen}`);
                container.innerHTML = '';
                
                // Filtere Personen für diese Generation
                const peopleInGen = familyData.filter((p, originalIndex) => {
                    p.origIndex = originalIndex; // Merke den echten Platz im Array fürs Bearbeiten/Löschen
                    return p.gen === gen;
                });

                if (peopleInGen.length === 0) {
                    container.innerHTML = '<div class="empty-message">Noch niemand eingetragen</div>';
                    container.classList.remove('has-multiple');
                } else {
                    // Wenn mehr als 1 Person in der Generation ist, aktivieren wir die Querverbindungslinie
                    if (peopleInGen.length > 1) {
                        container.classList.add('has-multiple');
                    } else {
                        container.classList.remove('has-multiple');
                    }

                    peopleInGen.forEach(person => {
                        const card = document.createElement('div');
                        card.className = `person-card ${person.gnd === 'f' ? 'female' : ''}`;
                        
                        card.onclick = (e) => {
                            if(!e.target.classList.contains('delete-btn')) editPerson(person.origIndex);
                        };
                        
                        const deathInfo = person.death ? `† ${person.death}` : '';
                        const dateText = person.birth ? `* ${person.birth} ${deathInfo}` : '';

                        card.innerHTML = `
                            <button class="delete-btn" onclick="event.stopPropagation(); deletePerson(${person.origIndex})">🗑️</button>
                            <div class="name">${person.name}</div>
                            <div class="dates">${dateText}</div>
                        `;
                        container.appendChild(card);
                    });
                }
            });
        }

        function editPerson(index) {
            const person = familyData[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('name').value = person.name;
            document.getElementById('birth').value = person.birth;
            document.getElementById('death').value = person.death;
            document.getElementById('gnd').value = person.gnd;
            document.getElementById('gen').value = person.gen;

            document.getElementById('formTitle').innerText = "✏️ Person bearbeiten";
            document.getElementById('submitBtn').innerText = "Änderungen speichern";
            document.getElementById('cancelBtn').style.display = "block";
            document.getElementById('personForm').scrollIntoView({ behavior: 'smooth' });
        }

        function deletePerson(index) {
            if(confirm("Möchtest du diese Person wirklich löschen?")) {
                familyData.splice(index, 1);
                saveAndRefresh();
                resetForm();
            }
        }

        function resetForm() {

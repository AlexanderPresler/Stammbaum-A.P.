<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stammbaum App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #333;
            padding-bottom: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        /* Der Stammbaum-Kasten */
        .tree {
            display: flex;
            flex-direction: column-reverse; /* Dreht die Ansicht um: Kinder unten, Ahnen oben */
            align-items: center;
            gap: 40px;
            position: relative;
        }
        .generation {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            position: relative;
        }
        /* Karten-Styling */
        .node {
            width: 110px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            text-align: center;
            padding: 10px 5px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            border-top: 4px solid #bdc3c7;
        }
        .node.male { border-top-color: #3498db; }
        .node.female { border-top-color: #e74c3c; }
        
        /* Platzhalter für fehlende Eltern */
        .node.placeholder {
            border: 2px dashed #bdc3c7;
            background: #eaeded;
            cursor: pointer;
            color: #7f8c8d;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .node.placeholder .plus {
            font-size: 1.2rem;
            margin-bottom: 4px;
            background: #bdc3c7;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .name {
            font-weight: bold;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .date {
            font-size: 0.7rem;
            color: #7f8c8d;
            margin-top: 2px;
        }
        .delete-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 0.75rem;
            cursor: pointer;
        }
        /* Verbindungslinien (CSS-Connector-Logik) */
        .connect-line {
            position: absolute;
            background: #bdc3c7;
            z-index: 1;
        }
        /* Eingabemaske am unteren Rand */
        .form-container {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
        }
        .form-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; }
        input[type="text"] { grid-column: span 2; }
        button.submit-btn { grid-column: span 2; background: #2ecc71; color: white; border: none; font-weight: bold; }
        button.cancel-btn { grid-column: span 2; background: #95a5a6; color: white; border: none; }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum</h1>

    <!-- Der Stammbaum-Bereich -->
    <div class="tree" id="treeCanvas">
        <!-- Wird komplett dynamisch durch JavaScript aufgebaut -->
    </div>

    <!-- Das Formular -->
    <div class="form-container" id="formBox" style="display: none;">
        <div class="form-title" id="formTitle">Person hinzufügen</div>
        <form id="personForm">
            <input type="hidden" id="targetRole">
            <input type="hidden" id="targetIndex" value="-1">
            <input type="text" id="name" placeholder="Vor- und Nachname" required>
            <input type="number" id="birth" placeholder="Geburtsjahr">
            <input type="number" id="death" placeholder="Todesjahr (leer lassen wenn lebend)">
            <button type="submit" class="submit-btn" id="submitBtn">Speichern</button>
            <button type="button" class="cancel-btn" onclick="closeForm()">Abbrechen</button>
        </form>
    </div>

    <script>
        // Strukturierte Daten: Jedes Mitglied hat feste Plätze für Vater und Mutter (IDs)
        // ID 1 bist standardmäßig DU als Ausgangspunkt.
        let defaultData = {
            1: { name: "Alexander Presler", birth: "1982", death: "", gnd: "m", father: 2, mother: 3 },
            2: { name: "Vladimir Lagutochkin", birth: "1959", death: "", gnd: "m", father: 4, mother: 5 },
            3: { name: "Swetlana Presler", birth: "1961", death: "", gnd: "f", father: 6, mother: 7 },
            5: { name: "Raisa Gredneva", birth: "1941", death: "", gnd: "f", father: 0, mother: 0 }
        };

        let familyTree = JSON.parse(localStorage.getItem('fixedFamilyTree')) || defaultData;

        function saveTree() {
            localStorage.setItem('fixedFamilyTree', JSON.stringify(familyTree));
            renderTree();
        }

        function openAddForm(parentRole, childId) {
            document.getElementById('personForm').reset();
            document.getElementById('targetRole').value = parentRole;
            document.getElementById('targetIndex').value = childId;
            document.getElementById('formTitle').innerText = parentRole === 'father' ? "➕ Vater hinzufügen" : "➕ Mutter hinzufügen";
            document.getElementById('formBox').style.display = "block";
            document.getElementById('formBox').scrollIntoView({ behavior: 'smooth' });
        }

        function closeForm() {
            document.getElementById('formBox').style.display = "none";
        }

        function deleteNode(id) {
            if(confirm("Möchtest du diese Person aus dem Stammbaum entfernen?")) {
                delete familyTree[id];
                // Referenzen bei Kindern löschen
                for (let key in familyTree) {
                    if(familyTree[key].father == id) familyTree[key].father = 0;
                    if(familyTree[key].mother == id) familyTree[key].mother = 0;
                }
                saveTree();
            }
        }

        function createNodeHTML(id, role, childId, gender) {
            const person = familyTree[id];
            if (person) {
                const avatarEmoji = person.gnd === 'm' ? '👤' : '👩';
                const dateText = person.birth ? `${person.birth}–${person.death || 'Lebend'}` : '';
                return `
                    <div class="node ${person.gnd === 'm' ? 'male' : 'female'}">
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteNode(${id})">🗑️</button>
                        <div class="avatar">${avatarEmoji}</div>
                        <div class="name">${person.name}</div>
                        <div class="date">${dateText}</div>
                    </div>
                `;
            } else {
                const roleLabel = role === 'father' ? 'Vater<br>hinzufügen' : 'Mutter<br>hinzufügen';
                return `
                    <div class="node placeholder" onclick="openAddForm('${role}', ${childId})">
                        <div class="plus">+</div>
                        <div>${roleLabel}</div>
                    </div>
                `;
            }
        }

        function renderTree() {
            const canvas = document.getElementById('treeCanvas');
            canvas.innerHTML = '';

            // Hier bauen wir die 3 Generationen fest basierend auf ID 1 (Dir) auf:
            // Gen 3: Urgroßeltern (Die Eltern von ID 2 und ID 3)
            // Gen 2: Großeltern / Eltern (ID 2 und ID 3)
            // Gen 1: Du / Kinder (ID 1)
            
            const p1 = familyTree[1] || { father: 0, mother: 0 };
            const fId = p1.father;
            const mId = p1.mother;
            
            const p2 = familyTree[fId] || { father: 0, mother: 0 };
            const p3 = familyTree[mId] || { father: 0, mother: 0 };

            // HTML Struktur für die feste Hierarchie generieren
            canvas.innerHTML = `
                <!-- Generation 3: Urgroßeltern -->
                <div class="generation">
                    ${createNodeHTML(p2.father, 'father', fId, 'm')}
                    ${createNodeHTML(p2.mother, 'mother', fId, 'f')}
                    ${createNodeHTML(p3.father, 'father', mId, 'm')}
                    ${createNodeHTML(p3.mother, 'mother', mId, 'f')}
                </div>
                <!-- Generation 2: Eltern -->
                <div class="generation">
                    ${createNodeHTML(fId, 'father', 1, 'm')}
                    ${createNodeHTML(mId, 'mother', 1, 'f')}
                </div>
                <!-- Generation 1: Hauptperson -->
                <div class="generation">

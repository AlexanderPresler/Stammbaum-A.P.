<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Stammbaum Profi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            padding-bottom: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.3rem; color: #2c3e50; margin-bottom: 20px; }
        
        /* Das Stammbaum-Diagramm-Netzwerk */
        .tree {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tree ul {
            padding-top: 20px; position: relative;
            display: flex; justify-content: center;
            list-style-type: none; padding-left: 0; margin: 0;
        }
        .tree li {
            text-align: center; list-style-type: none;
            position: relative; padding: 20px 5px 0 5px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Echte vertikale und horizontale Verbindungslinien */
        .tree li::before, .tree li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #bdc3c7; width: 50%; height: 20px;
        }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #bdc3c7; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid #bdc3c7; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #bdc3c7; width: 0; height: 20px; }

        /* Ehepartner-Block nebeneinander */
        .couple-container {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .rings {
            font-size: 1.1rem; z-index: 15; background: #f3f4f6; padding: 0 2px; color: #f1c40f;
        }

        /* Personenkarten-Design */
        .person-card {
            width: 125px; background: white; border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06); text-align: center;
            padding: 12px 6px; min-height: 100px; border: 3px solid #bdc3c7;
            position: relative; display: flex; flex-direction: column;
            justify-content: center; gap: 3px; z-index: 10; cursor: pointer;
        }
        .person-card.male { border-color: #3498db; }
        .person-card.female { border-color: #f78fb3; } /* Rosa Umrandung */
        
        /* Schwarzes Trauer-Dreieck oben links */
        .person-card.deceased::before {
            content: ""; position: absolute; top: 0; left: 0; width: 0; height: 0;
            border-top: 22px solid black; border-right: 22px solid transparent;
            border-top-left-radius: 4px; z-index: 12;
        }

        .name-display { font-weight: bold; font-size: 0.85rem; color: #2c3e50; }
        .info-display { font-size: 0.65rem; color: #7f8c8d; line-height: 1.2; }

        /* Eingabemaske am unteren Rand (Versteckt) */
        .form-container {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            border-top-left-radius: 16px; border-top-right-radius: 16px;
            max-height: 280px; overflow-y: auto; z-index: 1000; display: none;
        }
        .form-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; color: #2c3e50; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select, button { padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; }
        .full-width { grid-column: span 2; }
        button.submit-btn { background: #2ecc71; color: white; border: none; font-weight: bold; }
        button.cancel-btn { background: #95a5a6; color: white; border: none; }
        button.del-btn { background: #e74c3c; color: white; border: none; }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum Profi</h1>

    <div class="tree" id="treeCanvas"></div>

    <!-- Das ausgeblendete Formular -->
    <div class="form-container" id="formBox">
        <div class="form-title" id="formTitle">Mitglied bearbeiten / hinzufügen</div>
        <form id="personForm">
            <input type="hidden" id="activeId">
            <input type="hidden" id="actionType">
            
            <input type="text" id="firstName" placeholder="Vorname" required>
            <input type="text" id="lastName" placeholder="Nachname" required>
            <input type="text" id="birthDate" placeholder="Geburtsdatum (z.B. 01.08.1959)">
            <input type="text" id="birthPlace" placeholder="Geburtsort">
            
            <select id="gender">
                <option value="m">Männlich (Blauer Rand)</option>
                <option value="f">Weiblich (Rosa Rand)</option>
            </select>
            <input type="text" id="deathDate" placeholder="Todestag (leer lassen falls lebend)">
            
            <button type="submit" class="submit-btn full-width">Speichern</button>
            <button type="button" class="del-btn full-width" id="deleteBtn" onclick="deleteActiveNode()">Person löschen</button>
            <button type="button" class="cancel-btn full-width" onclick="closeForm()">Abbrechen</button>
        </form>
    </div>

    <script>
        // Wir erzwingen hier ein völlig neues, sauberes Speicher-Label ("forcedCleanTree"), 
        // damit alte kaputte Daten im Handyspeicher komplett ignoriert werden!
        let defaultData = {
            "1": { id: 1, firstName: "Alexander", lastName: "Presler", birthDate: "1982", birthPlace: "München", deathDate: "", gender: "m", father: 2, mother: 3 },
            "2": { id: 2, firstName: "Vladimir", lastName: "Presler", birthDate: "01.08.1959", birthPlace: "", deathDate: "", gender: "m", father: 4, mother: 5 },
            "3": { id: 3, firstName: "Swetlana", lastName: "Presler", birthDate: "01.06.1961", birthPlace: "", deathDate: "", gender: "f", father: 6, mother: 7 },
            "5": { id: 5, firstName: "Raisa", lastName: "Gredneva", birthDate: "1941", birthPlace: "", deathDate: "12.10.2020", gender: "f", father: 0, mother: 0 }
        };

        let familyTree = JSON.parse(localStorage.getItem('forcedCleanTree')) || defaultData;

        function saveAndRefresh() {
            localStorage.setItem('forcedCleanTree', JSON.stringify(familyTree));
            renderTree();
        }

        function closeForm() { document.getElementById('formBox').style.display = "none"; }

        function handleCardClick(id) {
            const p = familyTree[id];
            if(!p) return;
            document.getElementById('personForm').reset();
            document.getElementById('activeId').value = id;
            
            const option = prompt(`Wähle für ${p.firstName}:\n'e' - Bearbeiten / Löschen\n'v' - Vater hinzufügen\n'm' - Mutter hinzufügen`);
            
            if (option === 'e' || option === 'E') {
                document.getElementById('actionType').value = 'edit';
                document.getElementById('firstName').value = p.firstName;
                document.getElementById('lastName').value = p.lastName;
                document.getElementById('birthDate').value = p.birthDate || "";
                document.getElementById('birthPlace').value = p.birthPlace || "";
                document.getElementById('gender').value = p.gender;
                document.getElementById('deathDate').value = p.deathDate || "";
                document.getElementById('formTitle').innerText = "✏️ Daten ändern";
                document.getElementById('deleteBtn').style.display = "block";
                document.getElementById('formBox').style.display = "block";
            } else if (option === 'v' || option === 'V') {
                if(p.father && familyTree[p.father]) { alert("Vater existiert bereits!"); return; }
                document.getElementById('actionType').value = 'add_father';
                document.getElementById('gender').value = 'm';
                document.getElementById('formTitle').innerText = `Vater für ${p.firstName} hinzufügen`;
                document.getElementById('deleteBtn').style.display = "none";
                document.getElementById('formBox').style.display = "block";
            } else if (option === 'm' || option === 'M') {
                if(p.mother && familyTree[p.mother]) { alert("Mutter existiert bereits!"); return; }
                document.getElementById('actionType').value = 'add_mother';
                document.getElementById('gender').value = 'f';
                document.getElementById('formTitle').innerText = `Mutter für ${p.firstName} hinzufügen`;
                document.getElementById('deleteBtn').style.display = "none";
                document.getElementById('formBox').style.display = "block";
            }
        }

        function deleteActiveNode() {
            const id = parseInt(document.getElementById('activeId').value);
            if(confirm("Diese Person wirklich löschen?")) {
                delete familyTree[id];
                for(let key in familyTree) {
                    if(familyTree[key].father === id) familyTree[key].father = 0;
                    if(familyTree[key].mother === id) familyTree[key].mother = 0;
                }
                saveAndRefresh();
                closeForm();
            }
        }

        function generateCard(id) {
            const p = familyTree[id];

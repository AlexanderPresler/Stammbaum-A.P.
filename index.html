<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stammbaum Profi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            padding-bottom: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.2rem; color: #2c3e50; margin-bottom: 20px; }
        
        /* Das exakte Baum-Netzwerk aus deinem Wunschbild */
        .tree-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            position: relative;
            width: 100%;
        }
        .layer {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            position: relative;
        }
        .couple-unit {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        
        /* Karten-Design */
        .person-card {
            width: 115px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            text-align: center;
            padding: 10px 6px;
            min-height: 95px;
            border: 3px solid #bdc3c7;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            z-index: 10;
            cursor: pointer;
        }
        .person-card.male { border-color: #3498db; }
        .person-card.female { border-color: #f78fb3; }
        
        /* Schwarzes Trauer-Dreieck oben links */
        .person-card.deceased::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 0; height: 0;
            border-top: 20px solid black;
            border-right: 20px solid transparent;
            border-top-left-radius: 4px;
            z-index: 12;
        }

        .name-display { font-weight: bold; font-size: 0.8rem; color: #2c3e50; }
        .info-display { font-size: 0.65rem; color: #7f8c8d; line-height: 1.2; }
        .rings-label { font-size: 1.1rem; color: #f1c40f; z-index: 15; }

        /* Eingabemaske unten */
        .form-container {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            border-top-left-radius: 16px; border-top-right-radius: 16px;
            max-height: 280px; overflow-y: auto; z-index: 1000; display: none;
        }
        .form-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; color: #2c3e50; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select, button { padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; }
        .full-width { grid-column: span 2; }
        button.submit-btn { background: #2ecc71; color: white; border: none; font-weight: bold; }
        button.cancel-btn { background: #95a5a6; color: white; border: none; }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum Profi</h1>

    <!-- Strukturiertes Diagramm -->
    <div class="tree-grid" id="treeCanvas"></div>

    <!-- Versteckte Eingabemaske -->
    <div class="form-container" id="formBox">
        <div class="form-title" id="formTitle">Person bearbeiten</div>
        <form id="personForm">
            <input type="hidden" id="activeId">
            <input type="hidden" id="actionType">
            
            <input type="text" id="firstName" placeholder="Vorname" required>
            <input type="text" id="lastName" placeholder="Nachname" required>
            <input type="text" id="birthDate" placeholder="Geburtsdatum">
            <input type="text" id="birthPlace" placeholder="Geburtsort">
            
            <select id="gender">
                <option value="m">Männlich (Blauer Rand)</option>
                <option value="f">Weiblich (Rosa Rand)</option>
            </select>
            <input type="text" id="deathDate" placeholder="Todestag (leer lassen wenn lebend)">
            
            <button type="submit" class="submit-btn full-width">Speichern</button>
            <button type="button" class="cancel-btn full-width" onclick="closeForm()">Abbrechen</button>
        </form>
    </div>

    <script>
        // Saubere, feste Datenstruktur passend zu deiner echten Familie auf dem Bild
        let defaultData = {
            "p5": { id: "p5", firstName: "Raisa", lastName: "Gredneva", birthDate: "1941", birthPlace: "", deathDate: "12.10.2020", gender: "f" },
            "p2": { id: "p2", firstName: "Vladimir", lastName: "Lagutochkin", birthDate: "1959", birthPlace: "", deathDate: "", gender: "m" },
            "p3": { id: "p3", firstName: "Swetlana", lastName: "Presler", birthDate: "1961", birthPlace: "", deathDate: "", gender: "f" },
            "p1": { id: "p1", firstName: "Alexander", lastName: "Presler", birthDate: "1982", birthPlace: "", deathDate: "", gender: "m" },
            "p6": { id: "p6", firstName: "Elina", lastName: "Presler", birthDate: "1986", birthPlace: "", deathDate: "", gender: "f" },
            "p7": { id: "p7", firstName: "Emma", lastName: "Presler", birthDate: "2018", birthPlace: "", deathDate: "", gender: "f" }
        };

        // Zwingt die App, alte kaputte Speicherdaten zu verwerfen
        let familyTree = JSON.parse(localStorage.getItem('finalHierarchicalTreeFix')) || defaultData;

        function saveAndRefresh() {
            localStorage.setItem('finalHierarchicalTreeFix', JSON.stringify(familyTree));
            renderTree();
        }

        function closeForm() { document.getElementById('formBox').style.display = "none"; }

        function handleCardClick(id) {
            const p = familyTree[id];
            if(!p) return;
            document.getElementById('personForm').reset();
            document.getElementById('activeId').value = id;
            document.getElementById('actionType').value = 'edit';
            
            document.getElementById('firstName').value = p.firstName;
            document.getElementById('lastName').value = p.lastName;
            document.getElementById('birthDate').value = p.birthDate || "";
            document.getElementById('birthPlace').value = p.birthPlace || "";
            document.getElementById('gender').value = p.gender;
            document.getElementById('deathDate').value = p.deathDate || "";
            
            document.getElementById('formTitle').innerText = `✏️ ${p.firstName} bearbeiten`;
            document.getElementById('formBox').style.display = "block";
        }

        function generateCardHTML(id, roleLabel) {
            const p = familyTree[id];
            if (!p) {
                return `<div class="person-card" style="border:2px dashed #ccc; background:#eee; color:#aaa; font-size:0.65rem;">+ ${roleLabel}</div>`;
            }
            const isDeceased = p.deathDate && p.deathDate.trim() !== "";
            return `
                <div class="person-card ${p.gender === 'm' ? 'male' : 'female'} ${isDeceased ? 'deceased' : ''}" onclick="handleCardClick('${id}')">
                    <div class="name-display">${p.firstName}<br>${p.lastName}</div>
                    <div class="info-display">
                        <div>* ${p.birthDate || ''}</div>
                        ${p.birthPlace ? `<div>📍 ${p.birthPlace}</div>` : ''}
                        ${p.deathDate ? `<div>† ${p.deathDate}</div>` : '<div>Lebend</div>'}
                    </div>
                </div>
            `;
        }

        function renderTree() {
            const canvas = document.getElementById('treeCanvas');
            
            // Baut die exakten 4 Schichten deines Wunschbildes von oben nach unten auf
            canvas.innerHTML = `
                <!-- Schicht 4: Großeltern ganz oben -->
                <div class="layer">
                    <div class="couple-unit">
                        ${generateCardHTML("p4", "Uropa L.")}
                        <div class="rings-label"></div>
                        ${generateCardHTML("p5", "Uroma G.")}
                    </div>
                    <div class="couple-unit" style="margin-left:40px;">
                        ${generateCardHTML("p8", "Großvater")}
                        <div class="rings-label"></div>
                        ${generateCardHTML("p9", "Großmutter")}
                    </div>
                </div>

                <!-- Schicht 3: Eltern -->
                <div class="layer">
                    <div class="couple-unit">
                        ${generateCardHTML("p2", "Vater")}
                        <div class="rings-label">💍</div>
                        ${generateCardHTML("p3", "Mutter")}
                    </div>
                </div>

                <!-- Schicht 2: Du & Ehepartnerin -->
                <div class="layer">
                    <div class="couple-unit">
                        ${generateCardHTML("p1", "Ich")}
                        <div class="rings-label">💍</div>
                        ${generateCardHTML("p6", "Partnerin")}
                    </div>
                </div>

                <!-- Schicht 1: Kinder ganz unten -->
                <div class="layer">
                    ${generateCardHTML("p7", "Kind")}
                </div>
            `;
        }

        document.getElementById('personForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('activeId').value;
            
            familyTree[id].firstName = document.getElementById('firstName').value;

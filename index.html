<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Familienstammbaum</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            color: #333;
            padding-bottom: 260px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }
        .generation {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap;
        }
        .person-card {
            background: white;
            border-left: 5px solid #3498db;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-width: 140px;
            text-align: center;
        }
        .person-card.female {
            border-left-color: #e74c3c;
        }
        .name {
            font-weight: bold;
            font-size: 1rem;
        }
        .dates {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #bdc3c7;
            margin-bottom: 2px;
            margin-top: 10px;
        }
        .form-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
        }
        .form-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input[type="text"] {
            grid-column: span 2;
        }
        button {
            grid-column: span 2;
            background-color: #2ecc71;
            color: white;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🌳 Mein Stammbaum</h1>

    <div class="tree-container" id="tree">
        <div class="label">Großeltern</div>
        <div class="generation" id="gen-grandparents"></div>

        <div class="label">Eltern</div>
        <div class="generation" id="gen-parents"></div>

        <div class="label">Kinder</div>
        <div class="generation" id="gen-children"></div>
    </div>

    <div class="form-container">
        <div class="form-title">➕ Neue Person hinzufügen</div>
        <form id="personForm">
            <input type="text" id="name" placeholder="Name" required>
            <input type="number" id="birth" placeholder="Geburtsjahr">
            <input type="number" id="death" placeholder="Todesjahr">
            <select id="gnd">
                <option value="m">Männlich</option>
                <option value="f">Weiblich</option>
            </select>
            <select id="gen">
                <option value="grandparents">Großeltern</option>
                <option value="parents">Eltern</option>
                <option value="children">Kinder</option>
            </select>
            <button type="submit">Hinzufügen</button>
        </form>
    </div>

    <script>
        let defaultData = [
            { name: "Opa Müller", gnd: "m", birth: "1940", death: "2015", gen: "grandparents" },
            { name: "Oma Müller", gnd: "f", birth: "1943", death: "", gen: "grandparents" },
            { name: "Papa Müller", gnd: "m", birth: "1968", death: "", gen: "parents" },
            { name: "Mama Müller", gnd: "f", birth: "1970", death: "", gen: "parents" },
            { name: "Ich", gnd: "m", birth: "1998", death: "", gen: "children" }
        ];

        let familyData = JSON.parse(localStorage.getItem('myFamilyTree')) || defaultData;

        function renderTree() {
            document.getElementById('gen-grandparents').innerHTML = '';
            document.getElementById('gen-parents').innerHTML = '';
            document.getElementById('gen-children').innerHTML = '';

            familyData.forEach(person => {
                const container = document.getElementById(`gen-${person.gen}`);
                if (container) {
                    const card = document.createElement('div');
                    card.className = `person-card ${person.gnd === 'f' ? 'female' : ''}`;
                    
                    const deathInfo = person.death ? `† ${person.death}` : '';
                    const dateText = person.birth ? `* ${person.birth} ${deathInfo}` : '';

                    card.innerHTML = `
                        <div class="name">${person.name}</div>
                        <div class="dates">${dateText}</div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        document.getElementById('personForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newPerson = {
                name: document.getElementById('name').value,
                birth: document.getElementById('birth').value,
                death: document.getElementById('death').value,
                gnd: document.getElementById('gnd').value,
                gen: document.getElementById('gen').value
            };

            familyData.push(newPerson);
            localStorage.setItem('myFamilyTree', JSON.stringify(familyData));
            renderTree();
            document.getElementById('personForm').reset();
        });

        renderTree();
    </script>
</body>
</html>
